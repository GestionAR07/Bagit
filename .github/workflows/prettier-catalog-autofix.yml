name: Catalog Prettier Autofix

on:
  push:
    branches:
      - feat/merchant-catalog-visual-polish

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/merchant-catalog-visual-polish

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format catalog files
        run: |
          npx prettier --write \
            'src/app/merchant/[merchantId]/catalog/catalog-polish.module.css' \
            'src/app/merchant/[merchantId]/catalog/page.tsx' \
            'src/app/merchant/[merchantId]/catalog/products/[productId]/page.tsx' \
            'src/app/merchant/[merchantId]/catalog/products/new/page.tsx'

      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            'src/app/merchant/[merchantId]/catalog/catalog-polish.module.css' \
            'src/app/merchant/[merchantId]/catalog/page.tsx' \
            'src/app/merchant/[merchantId]/catalog/products/[productId]/page.tsx' \
            'src/app/merchant/[merchantId]/catalog/products/new/page.tsx'
          if git diff --cached --quiet; then
            echo 'No formatting changes needed.'
          else
            git commit -m 'style: apply catalog prettier formatting'
            git push origin HEAD:feat/merchant-catalog-visual-polish
          fi
